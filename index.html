<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca Online</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="hi">
      <a class="logo" href="index.html">📚 Biblioteca Online</a>
      <nav>
        <button data-view="catalog" class="on">Catalog</button>
        <button data-view="imprumuturi">Cărțile mele (<span id="cnt">0</span>)</button>
        <button data-view="favorite">Favorite</button>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <div class="hero">
    <h1 id="ttl">Descoperă cărți</h1>
    <p id="sub">Caută în catalog, împrumută pe 14 zile și păstrează-ți lista de favorite.</p>
  </div>

  <div class="tools" id="tools">
    <input id="q" type="search" placeholder="Caută după titlu sau autor…">
    <div class="chips" id="chips"></div>
  </div>

  <main>
    <div class="grid" id="g"></div>
  </main>

  <footer>© Biblioteca Online · proiect demonstrativ</footer>
  <div id="toast"></div>

  <script src="js/common.js"></script>
  <script src="js/books.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
